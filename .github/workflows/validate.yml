name: Validate

# Stage 1 — 경고용 검증 하네스. main push/PR 마다 사이트 정합성을 점검한다.
# GitHub Pages 는 브랜치를 그대로 서빙하므로 이 워크플로는 "배포를 막지 않고"
# 빨간 X 로 알려주기만 한다(개수 불일치·AdSense 누락·보호 파일·JSON-LD·깨진 링크 등).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS 신택스 검사 (node --check)
        run: |
          shopt -s nullglob
          for f in *.js scripts/*.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: sitemap.xml XML 유효성
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml OK')"

      - name: 사이트 정합성 검증 (개수·보호파일·AdSense·JSON-LD·내부 링크)
        run: node scripts/validate.js
