<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var WB=null;
  try{ WB=window.dgbToolbox; }catch(e){}
  if(!WB || !WB.CATEGORIES){ try{ $('fallback').style.display='block'; $('fallback').textContent='도구 데이터를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.'; }catch(e){} return; }

  var state={ count:2, tools:[null,null], active:0, pickFor:0 };

  function validSlug(s){ try{ return !!WB.findTool(s); }catch(e){ return false; } }
  function toolName(s){ var t=WB.findTool(s); return t?t.name:s; }

  function parseURL(){
    try{
      var m=/[?&]tools=([^&]*)/.exec(location.search);
      if(!m) return;
      var arr=decodeURIComponent(m[1]).split(',').map(function(x){return x.trim();});
      var valid=[];
      for(var i=0;i<arr.length && valid.length<3;i++){ if(arr[i] && validSlug(arr[i])) valid.push(arr[i]); else if(arr[i]==='') valid.push(null); }
      // 길이 결정: 유효 항목 기준(2~3)
      var cnt=Math.min(3,Math.max(2,arr.length));
      state.count=cnt;
      state.tools=[]; for(var j=0;j<cnt;j++){ var v=arr[j]; state.tools.push(v&&validSlug(v)?v:null); }
    }catch(e){}
  }
  function updateURL(){
    try{
      var qs=state.tools.map(function(s){return s||'';}).join(',');
      var url=location.pathname+'?tools='+encodeURIComponent(qs);
      history.replaceState(null,'',url);
    }catch(e){}
  }

  function setCount(n){
    n=n===3?3:2;
    if(n>state.count){ while(state.tools.length<n) state.tools.push(null); }
    else { state.tools=state.tools.slice(0,n); if(state.active>=n) state.active=0; }
    state.count=n;
    render(); updateURL();
  }

  function render(){
    // 분할 세그 active
    var segBtns=$('splitSeg').querySelectorAll('button');
    for(var i=0;i<segBtns.length;i++) segBtns[i].classList.toggle('active', +segBtns[i].dataset.n===state.count);
    // 탭(모바일)
    var tabsHtml='';
    for(var t=0;t<state.count;t++){ var nm=state.tools[t]?esc(toolName(state.tools[t])):'패널 '+(t+1); tabsHtml+='<button type="button" data-t="'+t+'"'+(t===state.active?' class="active"':'')+'>'+nm+'</button>'; }
    $('tabs').innerHTML=tabsHtml;
    // 패널
    var html='';
    for(var p=0;p<state.count;p++){
      var slug=state.tools[p], cls='wb-panel'+(p===state.active?' active':'');
      var head='<div class="wb-phead"><span class="nm">'+(slug?esc(toolName(slug)):'패널 '+(p+1))+'</span>'+
        '<button type="button" data-act="pick" data-i="'+p+'">'+(slug?'교체':'도구 선택')+'</button>'+
        (slug?'<button type="button" data-act="clear" data-i="'+p+'">비우기</button>':'')+'</div>';
      var body;
      if(slug){ body='<div class="wb-body"><iframe src="/'+encodeURIComponent(slug)+'/?embed=1" loading="lazy" title="'+esc(toolName(slug))+'"></iframe></div>'; }
      else { body='<div class="wb-body"><div class="wb-empty"><div>이 패널은 비어 있습니다</div><button type="button" data-act="pick" data-i="'+p+'">＋ 도구 선택</button></div></div>'; }
      html+='<div class="'+cls+'">'+head+body+'</div>';
    }
    $('panels').innerHTML=html;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  /* 픽커 모달 */
  function openPicker(i){ state.pickFor=i; $('search').value=''; buildList(''); $('modal').classList.add('open'); setTimeout(function(){ try{$('search').focus();}catch(e){} },50); }
  function closePicker(){ $('modal').classList.remove('open'); }
  function buildList(q){
    q=(q||'').trim().toLowerCase();
    var html='';
    function matches(t){ return !q || t.name.toLowerCase().indexOf(q)>=0 || t.slug.toLowerCase().indexOf(q)>=0; }
    function itemHtml(t){ var ic=''; try{ ic=WB.iconHtml(t.icon); }catch(e){ ic=''; } return '<button type="button" class="wb-item" data-slug="'+t.slug+'"><span class="ic">'+ic+'</span><span>'+esc(t.name)+'</span></button>'; }
    // 즐겨찾기 그룹
    try{
      var favs=WB.getFavs(), favItems='';
      for(var f=0;f<favs.length;f++){ var ft=WB.findTool(favs[f]); if(ft&&matches(ft)) favItems+=itemHtml(ft); }
      if(favItems) html+='<div class="wb-grp"><div class="wb-kick">⭐ 즐겨찾기</div>'+favItems+'</div>';
    }catch(e){}
    // 카테고리
    var cats=WB.CATEGORIES;
    for(var c=0;c<cats.length;c++){
      var items='';
      for(var j=0;j<cats[c].tools.length;j++){ var tt=cats[c].tools[j]; if(matches(tt)) items+=itemHtml(tt); }
      if(items) html+='<div class="wb-grp"><div class="wb-kick">'+esc(cats[c].label)+'</div>'+items+'</div>';
    }
    $('list').innerHTML=html||'<div class="wb-empty-search">검색 결과가 없습니다.</div>';
  }

  /* 이벤트 */
  $('splitSeg').addEventListener('click',function(e){ var b=e.target.closest('button[data-n]'); if(b) setCount(+b.dataset.n); });
  $('tabs').addEventListener('click',function(e){ var b=e.target.closest('button[data-t]'); if(!b) return; state.active=+b.dataset.t; render(); });
  $('panels').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var i=+b.dataset.i;
    if(b.dataset.act==='pick') openPicker(i);
    else if(b.dataset.act==='clear'){ state.tools[i]=null; render(); updateURL(); }
  });
  $('list').addEventListener('click',function(e){ var b=e.target.closest('button[data-slug]'); if(!b) return; state.tools[state.pickFor]=b.dataset.slug; state.active=state.pickFor; closePicker(); render(); updateURL(); });
  $('search').addEventListener('input',function(){ buildList(this.value); });
  $('closeModal').addEventListener('click',closePicker);
  $('modal').addEventListener('click',function(e){ if(e.target===this) closePicker(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePicker(); });

  parseURL();
  render();
  updateURL();
})();
</script>
